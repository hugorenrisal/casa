# Dependabot: vigila las dependencias y abre una propuesta (pull request)
# cuando sale una versión nueva o se descubre un fallo de seguridad.
#
# Hasta ahora nadie se enteraba: en octubre de 2026 había tres fallos (uno
# crítico) en librerías que usa Express y llevaban semanas publicados.
#
# Cada propuesta pasa las pruebas automáticas (.github/workflows/pruebas.yml)
# antes de poder aceptarla: si se pone en verde, se puede fusionar tranquilo.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Las versiones menores y los parches juntos en una sola propuesta: menos
    # ruido. Las mayores (p. ej. Express 5) van aparte, porque pueden romper.
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
